<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="798" height="198" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Vertical Divider Lines -->
  <line x1="266" y1="30" x2="266" y2="170" stroke="#21262d" stroke-width="1.5"/>
  <line x1="534" y1="30" x2="534" y2="170" stroke="#21262d" stroke-width="1.5"/>

  <!-- LEFT PANEL: Total Contributions -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="133" y="85" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">2,187+</text>
    <text x="133" y="118" font-size="14" font-weight="700" fill="#e6edf3">Total Contributions</text>
    <text x="133" y="142" font-size="11" font-weight="500" fill="#8b949e">Oct 2024 - Present</text>
  </g>

  <!-- CENTER PANEL: Flame Icon + Circular Ring -->
  <g transform="translate(400, 80)">
    <!-- Glowing Ring -->
    <circle cx="0" cy="0" r="34" stroke="#ff4365" stroke-width="4.5" fill="none" filter="url(#glow)" opacity="0.4"/>
    <circle cx="0" cy="0" r="34" stroke="#ff4365" stroke-width="4.5" fill="none"/>
    
    <!-- Flame Icon -->
    <path d="M-6 -38 C-6 -44 0 -48 0 -50 C0 -48 6 -44 6 -38 C7 -34 4 -30 0 -30 C-4 -30 -7 -34 -6 -38 Z" fill="#ff4365"/>
    <path d="M-3 -36 C-3 -40 0 -43 0 -44 C0 -43 3 -40 3 -36 C3.5 -34 2 -32 0 -32 C-2 -32 -3.5 -34 -3 -36 Z" fill="#ffb703"/>

    <!-- Center Streak Number -->
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">181</text>
  </g>
  
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="142" font-size="14" font-weight="700" fill="#ff4365">Current Active Streak</text>
    <text x="400" y="162" font-size="11" font-weight="500" fill="#8b949e">2026 Production Sync</text>
  </g>

  <!-- RIGHT PANEL: Peak Volume -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="667" y="85" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">1,617</text>
    <text x="667" y="118" font-size="14" font-weight="700" fill="#e6edf3">Peak Annual Commits</text>
    <text x="667" y="142" font-size="11" font-weight="500" fill="#8b949e">2025 Full-Year Matrix</text>
  </g>
</svg>
