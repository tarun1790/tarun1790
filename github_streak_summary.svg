<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background with subtle border -->
  <rect x="1" y="1" width="798" height="208" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Card Title -->
  <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">GitHub contributions summary</text>

  <!-- Vertical Divider Lines -->
  <line x1="266" y1="50" x2="266" y2="185" stroke="#30363d" stroke-width="1"/>
  <line x1="534" y1="50" x2="534" y2="185" stroke="#30363d" stroke-width="1"/>

  <!-- LEFT PANEL: Total Contributions -->
  <g transform="translate(133, 110)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text y="0" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">2,187+</text>
    <text y="28" font-size="13.5" font-weight="700" fill="#ffffff">Total Contributions</text>
    <text y="50" font-size="11.5" font-weight="400" fill="#8b949e">Oct 1, 2024 - Present</text>
  </g>

  <!-- CENTER PANEL: Flame Icon + Circular Progress Ring -->
  <g transform="translate(400, 102)">
    <!-- Glowing Progress Ring -->
    <circle cx="0" cy="0" r="33" stroke="#ff4365" stroke-width="3.5" fill="none" opacity="0.3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="33" stroke="#ff4365" stroke-width="3.5" fill="none"/>
    
    <!-- Animated Style Flame Icon -->
    <g transform="translate(0, -33)">
      <path d="M-6 -6 C-6 -13 0 -18 0 -20 C0 -18 6 -13 6 -6 C7 -1 4 3 0 3 C-4 3 -7 -1 -6 -6 Z" fill="#ff4365"/>
      <path d="M-3 -4 C-3 -9 0 -13 0 -14 C0 -13 3 -9 3 -4 C3.5 -1 2 1 0 1 C-2 1 -3.5 -1 -3 -4 Z" fill="#fbbf24"/>
    </g>

    <!-- Center Streak Number -->
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">181</text>
  </g>

  <g transform="translate(400, 110)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text y="48" font-size="13.5" font-weight="700" fill="#ff4365">Current Streak</text>
    <text y="68" font-size="11.5" font-weight="400" fill="#8b949e">Active Engineering Sync</text>
  </g>

  <!-- RIGHT PANEL: Longest Streak -->
  <g transform="translate(667, 110)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text y="0" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">1,617</text>
    <text y="28" font-size="13.5" font-weight="700" fill="#ffffff">Longest Streak</text>
    <text y="50" font-size="11.5" font-weight="400" fill="#8b949e">2025 Full-Year Matrix</text>
  </g>
</svg>
